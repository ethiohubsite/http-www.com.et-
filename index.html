<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>Premium Payments</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;color:#fff;background:#0b1220}
.card{width:100%;max-width:430px;padding:28px 22px;border:1px solid #263650;border-radius:20px;background:#111c2e;box-shadow:0 15px 45px #0006}
h1{text-align:center;margin:0 0 8px}.subtitle{text-align:center;color:#a9b8ce;margin:0 0 25px;font-size:14px}
label{display:block;margin:17px 0 7px;font-size:14px;font-weight:bold}
input,textarea{width:100%;padding:14px;border:1px solid #344762;border-radius:10px;background:#0b1423;color:white;font-size:16px;outline:none;font-family:Arial,sans-serif}
input:focus,textarea:focus{border-color:#2585ff}input[type=file]{font-size:13px;padding:11px}textarea{min-height:85px;resize:vertical}
.hint,.note{color:#9aabc2;font-size:12px;line-height:1.5}.hint{margin:6px 0 0}
#receiptPreview{display:none;width:100%;max-height:230px;object-fit:contain;margin-top:12px;border-radius:10px;background:#0b1423}
button{width:100%;margin-top:24px;padding:15px;border:0;border-radius:10px;background:#1877f2;color:white;font-size:16px;font-weight:bold}
button:disabled{opacity:.6}#status{margin-top:17px;text-align:center;font-size:14px;line-height:1.5;overflow-wrap:anywhere}.note{text-align:center;margin-top:20px}
</style>
</head>
<body>
<main class="card">
<h1>Premium Payments</h1>
<p class="subtitle">Submit your payment details for verification</p>
<form id="paymentForm">
<label for="phone">Phone Number</label>
<input id="phone" type="tel" placeholder="10XXXXXX" maxlength="20" required>
<label for="transaction">Transaction Number</label>
<input id="transaction" type="text" placeholder="Enter transaction/reference number" maxlength="100" required>
<label for="amount">Amount (ETB)</label>
<input id="amount" type="number" placeholder="Enter amount" min="1" max="1000000" step="0.01" required>
<label for="receipt">Payment Receipt Photo</label>
<input id="receipt" type="file" accept="image/jpeg,image/png,image/webp" required>
<p class="hint">JPG, PNG or WEBP only. Maximum file size: 5 MB.</p>
<img id="receiptPreview" alt="Receipt preview">
<label for="comment">Comment (optional)</label>
<textarea id="comment" maxlength="500" placeholder="Write a short message if needed"></textarea>
<button id="sendButton" type="submit">Send Payment Details</button>
<div id="status" role="status" aria-live="polite"></div>
</form>
<p class="note">Your payment details and receipt photo will be sent for manual verification.</p>
</main>
<script>
const WORKER_URL="https://premium-sender-telegram.adonayyemane153.workers.dev/api/payment-request";
const form=document.getElementById("paymentForm"),button=document.getElementById("sendButton"),statusBox=document.getElementById("status"),receiptInput=document.getElementById("receipt"),preview=document.getElementById("receiptPreview");
let previewUrl=null;
function status(message,color){statusBox.textContent=message;statusBox.style.color=color;}
receiptInput.addEventListener("change",()=>{
 const file=receiptInput.files[0];if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=null;preview.style.display="none";if(!file)return;
 if(!["image/jpeg","image/png","image/webp"].includes(file.type)){receiptInput.value="";status("Please select a JPG, PNG, or WEBP image.","#ff7777");return;}
 if(file.size>5*1024*1024){receiptInput.value="";status("Receipt image must be 5 MB or smaller.","#ff7777");return;}
 previewUrl=URL.createObjectURL(file);preview.src=previewUrl;preview.style.display="block";statusBox.textContent="";
});
form.addEventListener("submit",async event=>{
 event.preventDefault();const file=receiptInput.files[0];if(!file){status("Please upload your payment receipt photo.","#ff7777");return;}
 const body=new FormData();body.append("phone",document.getElementById("phone").value.trim());body.append("transaction",document.getElementById("transaction").value.trim());body.append("amount",document.getElementById("amount").value);body.append("comment",document.getElementById("comment").value.trim());body.append("receipt",file,file.name);
 button.disabled=true;button.textContent="Sending...";status("Please wait, sending your request...","#a9b8ce");
 try{const response=await fetch(WORKER_URL,{method:"POST",body});const result=await response.json().catch(()=>({}));if(!response.ok||!result.success)throw new Error(result.message||"Payment request failed.");status(result.message||"Request submitted. Please wait for manual verification.","#35d58a");form.reset();preview.style.display="none";if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=null;}
 catch(error){status("❌ "+(error.message||"Could not send. Please try again."),"#ff7777");}
 finally{button.disabled=false;button.textContent="Send Payment Details";}
});
</script>
</body>
</html>
