
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <title>Premium Payment Request</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #fff;
      background: #0b1220;
    }
    .card {
      width: 100%;
      max-width: 430px;
      padding: 28px 22px;
      border: 1px solid #263650;
      border-radius: 20px;
      background: #111c2e;
      box-shadow: 0 15px 45px #0006;
    }
    h1 { text-align: center; margin: 0 0 8px; }
    .subtitle {
      text-align: center;
      color: #a9b8ce;
      margin: 0 0 25px;
      font-size: 14px;
    }
    label {
      display: block;
      margin: 17px 0 7px;
      font-size: 14px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #344762;
      border-radius: 10px;
      background: #0b1423;
      color: white;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: #2585ff; }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #1877f2;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #status {
      margin-top: 17px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }
    .note {
      color: #9aabc2;
      text-align: center;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Premium Number</h1>
    <p class="subtitle">Submit your payment details for verification</p>

    <form id="paymentForm">
      <label for="phone">Phone Number</label>
      <input
        id="phone"
        type="tel"
        placeholder="09XXXXXXXX"
        maxlength="20"
        required
      >

      <label for="transaction">Transaction Number</label>
      <input
        id="transaction"
        type="text"
        placeholder="Enter transaction/reference number"
        maxlength="100"
        required
      >

      <label for="amount">Amount (ETB)</label>
      <input
        id="amount"
        type="number"
        placeholder="Enter amount"
        min="1"
        max="1000000"
        step="0.01"
        required
      >

      <button id="sendButton" type="submit">Send Payment Details</button>
      <div id="status" role="status"></div>
    </form>

    <p class="note">Your payment details will be sent securely for manual verification.</p>
  </main>

  <script>
    const WORKER_URL =
      "https://premium-sender-telegram.adonayyemane153.workers.dev/api/payment-request";

    const form = document.getElementById("paymentForm");
    const button = document.getElementById("sendButton");
    const statusBox = document.getElementById("status");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const data = {
        phone: document.getElementById("phone").value.trim(),
        transaction: document.getElementById("transaction").value.trim(),
        amount: Number(document.getElementById("amount").value)
      };

      button.disabled = true;
      button.textContent = "Sending...";
      statusBox.textContent = "Please wait...";
      statusBox.style.color = "#a9b8ce";

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.message || "Sending failed");
        }

        statusBox.textContent =
          "✅ Details sent successfully. Please wait for verification.";
        statusBox.style.color = "#35d58a";
        form.reset();

      } catch (error) {
        statusBox.textContent =
          "❌ Could not send. Please try again later.";
        statusBox.style.color = "#ff7777";
      } finally {
        button.disabled = false;
        button.textContent = "Send Payment Details";
      }
    });
  </script>
</body>
</html>
